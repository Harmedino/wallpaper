name: Weekly licensed wallpaper ingestion
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
jobs:
  ingest:
    if: vars.ENABLE_SCHEDULED_IMPORT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      STORAGE_PROVIDER: mongodb
      IMPORT_TARGET: '1000'
      IMPORT_MAX_MINUTES: '165'
      SOURCE_USER_AGENT: Wallspace/1.0 (+https://github.com/Harmedino/wallpaper)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm run import:library -- --weekly
